<div id="public-chat-panel" class="discussion-popover" role="dialog" aria-labelledby="public-chat-title" hidden tabindex="-1">
  {{- partial "discussion.html" (dict "room" "lobby" "id" "public-chat" "lobby" true "closable" true) -}}
</div>
<button type="button" class="discussion-launcher" data-discussion-toggle="public-chat-panel" aria-controls="public-chat-panel" aria-expanded="false" aria-label="{{ i18n "discussion_open" }}">
  {{ partial "discussion-icon.html" . }}
  <span>{{ i18n "discussion_chat" }}</span>
</button>
{{- $script := resources.Get "js/discussion.js" | minify | fingerprint -}}
<script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" defer></script>
